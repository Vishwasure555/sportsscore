name: Build Android APK

# The APK is a thin wrapper (Trusted Web Activity) around the hosted web app.
# Rebuild it only when the app name, icon or package changes, or to bump the
# version — normal code changes reach the phone through the web deploy.
on:
  workflow_dispatch:
  push:
    tags: ['apk-v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli@1.27.0

      - name: Prepare Android SDK for Bubblewrap
        run: |
          # Bubblewrap looks for sdkmanager under <sdk>/tools/bin; the runner ships it in cmdline-tools/latest.
          [ -e "$ANDROID_HOME/tools" ] || ln -s "$ANDROID_HOME/cmdline-tools/latest" "$ANDROID_HOME/tools"
          # Install the build-tools version Bubblewrap expects, accepting licences non-interactively.
          BT=$(node -p "require('$(npm root -g)/@bubblewrap/cli/node_modules/@bubblewrap/core/dist/lib/androidSdk/AndroidSdkTools.js').BUILD_TOOLS_VERSION" 2>/dev/null || node -p "require('$(npm root -g)/@bubblewrap/core/dist/lib/androidSdk/AndroidSdkTools.js').BUILD_TOOLS_VERSION")
          echo "Bubblewrap wants build-tools $BT"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;$BT" > /dev/null

      - name: Point Bubblewrap at the runner's JDK and Android SDK
        run: |
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_HOME\"}" > ~/.bubblewrap/config.json

      - name: Generate Android project
        run: |
          mkdir -p android-build
          cp android/twa-manifest.json android/upload.keystore android-build/
          cd android-build
          # Version code must increase on every build so the phone accepts the update.
          jq --argjson c "${{ github.run_number }}" --arg n "1.0.${{ github.run_number }}" \
            '.appVersionCode=$c | .appVersionName=$n | .appVersion=$n' twa-manifest.json > t.json && mv t.json twa-manifest.json
          bubblewrap update --skipVersionUpgrade

      - name: Build and sign APK
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$BUBBLEWRAP_KEYSTORE_PASSWORD" ]; then
            echo "::error::Add the KEYSTORE_PASSWORD repository secret first (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          cd android-build
          set +e
          bubblewrap build --skipPwaValidation < /dev/null 2>&1 | tee ../build.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" != "0" ] || [ ! -f app-release-signed.apk ]; then
            # Surface the end of the log as an annotation so it shows on the run page.
            msg=$( (grep -A 25 'What went wrong' ../build.log || tail -n 40 ../build.log) | head -40 | sed 's/\x1b\[[0-9;]*m//g' | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=Bubblewrap build failed::$msg"
            exit 1
          fi
          cp app-release-signed.apk ../SportsScore.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-build-${{ github.run_number }}"
          gh release create "$TAG" SportsScore.apk \
            --title "SportsScore APK (build ${{ github.run_number }})" \
            --notes "Open this page on your phone, tap SportsScore.apk, and install. App updates arrive automatically; you only need a new APK when this one changes." \
            --latest
