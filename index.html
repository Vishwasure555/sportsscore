<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1020" />
    <meta name="description" content="Live scores, fixtures and results for your favourite cricket teams and F1." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <title>SportsScore</title>
    <script>
      // On-phone debug console: open the app with ?debug once; it stays on until ?debug=off
      (function () {
        try {
          var q = new URLSearchParams(location.search).get('debug');
          if (q === 'off') localStorage.removeItem('ss_debug');
          else if (q !== null) localStorage.setItem('ss_debug', '1');
          if (localStorage.getItem('ss_debug')) {
            var s = document.createElement('script');
            s.src = 'https://cdn.jsdelivr.net/npm/eruda@3';
            s.onload = function () { window.eruda.init(); };
            document.head.appendChild(s);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
